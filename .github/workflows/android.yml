name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  JAVA_VERSION: "21"
  RUST_TOOLCHAIN: "stable"
  SHARED_RUST_REPOSITORY: "neboman11/any-player-shared-rust"
  ANDROID_NDK_VERSION: "27.0.12077973"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Checkout shared Rust workspace
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SHARED_RUST_REPOSITORY }}
          token: ${{ secrets.CI_REPO_READ_TOKEN != '' && secrets.CI_REPO_READ_TOKEN || github.token }}
          path: any-player-shared-rust

      - name: Link shared Rust workspace path
        run: ln -sfn "$GITHUB_WORKSPACE/any-player-shared-rust" "$GITHUB_WORKSPACE/../any-player-shared-rust"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi,i686-linux-android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ANDROID_HOME/ANDROID_SDK_ROOT is not set"
            exit 1
          fi
          yes | sdkmanager --sdk_root="$SDK_ROOT" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Generate local.properties
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          echo "spotifyClientId=ci-placeholder-client-id" >> local.properties

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug -PandroidNdkDir="$ANDROID_NDK_HOME"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest -PandroidNdkDir="$ANDROID_NDK_HOME"

      - name: Lint
        run: ./gradlew :app:lintDebug -PandroidNdkDir="$ANDROID_NDK_HOME"
