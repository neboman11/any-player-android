name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  JAVA_VERSION: "21"
  GRADLE_OPTS: "-Dorg.gradle.warning.mode=summary"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Verify Java toolchain
        run: |
          java -version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "Resolved Android SDK root is invalid: '$SDK_ROOT'"
            exit 1
          fi
          yes | sdkmanager --sdk_root="$SDK_ROOT" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Generate local.properties
        env:
          # Without the secret (e.g. fork PRs) the APK builds but can't sign in to Spotify.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "Resolved Android SDK root is invalid: '$SDK_ROOT'"
            exit 1
          fi
          echo "sdk.dir=$SDK_ROOT" > local.properties
          echo "spotifyClientId=${SPOTIFY_CLIENT_ID:-ci-placeholder-client-id}" >> local.properties

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Assemble debug
        run: ./gradlew --no-daemon --warning-mode=summary :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: any-player-debug-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || github.ref_name }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Unit tests
        run: ./gradlew --no-daemon --warning-mode=summary :core:model:test

      - name: Lint
        run: ./gradlew --no-daemon --warning-mode=summary :app:lintDebug
