name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  JAVA_VERSION: "21"
  GRADLE_OPTS: "-Dorg.gradle.warning.mode=summary"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Android setup
        uses: ./.github/actions/android-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}
          spotify-client-id: ${{ secrets.SPOTIFY_CLIENT_ID }}

      - name: All module unit tests
        run: >-
          ./gradlew --no-daemon --warning-mode=summary
          :core:model:test
          :core:data:testDebugUnitTest
          :playback:testDebugUnitTest
          :dj:testDebugUnitTest
          :app:testDebugUnitTest

      - name: Assemble debug
        run: ./gradlew --no-daemon --warning-mode=summary :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: any-player-debug-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || github.ref_name }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Lint
        run: ./gradlew --no-daemon --warning-mode=summary :app:lintDebug

  instrumented:
    # Android Auto session/sync integration tests on an emulator (see AndroidAutoSyncTest).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EMULATOR_API: 35

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Android setup
        uses: ./.github/actions/android-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}
          spotify-client-id: ${{ secrets.SPOTIFY_CLIENT_ID }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Compile outside the emulator so the device only boots for the test run itself.
      - name: Build app and test APKs
        run: ./gradlew --no-daemon --warning-mode=summary :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.EMULATOR_API }}-google_apis-x86_64

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --no-daemon --warning-mode=summary :app:connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-${{ github.sha }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          retention-days: 14
